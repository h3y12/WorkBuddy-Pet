name: script-win-x64

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read-only collector and worker regressions
        shell: powershell
        run: |
          & runtime/python.exe -I -S -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Shortcut and artwork regressions
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File tests/Test-Tools.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: WPF layout and settings checks
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File tests/Test-Ui.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Assemble public package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path app/Assets/mascot.local.png) { throw 'Private artwork must not be committed.' }
          & runtime/python.exe -I -S tools/package.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: WbPet-script-win-x64
          path: |
            dist/*.zip
            dist/*.zip.sha256
          retention-days: 30
